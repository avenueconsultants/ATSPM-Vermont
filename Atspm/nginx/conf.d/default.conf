server {
  listen 443 ssl;
  server_name localhost;

  ssl_certificate /etc/nginx/certs/aspnetapp.crt;
  ssl_certificate_key /etc/nginx/certs/aspnetapp.key;
  resolver 127.0.0.11 ipv6=off valid=30s;

  set $webui_upstream http://webui:3000;
  set $configapi_upstream https://configapi:5000;
  set $dataapi_upstream https://dataapi:5001;
  set $reportapi_upstream https://reportapi:5002;
  set $identityapi_upstream https://identityapi:5003;
  set $identityapi_signin_entra https://identityapi:5003/signin-entra;
  set $identityapi_signin_utahid https://identityapi:5003/signin-utahid;

  location / {
    proxy_pass $webui_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection keep-alive;
    proxy_set_header Host $http_host;
    proxy_cache_bypass $http_upgrade;
  }

  location /config/ {
    rewrite ^/config/?(.*)$ /$1 break;
    proxy_pass $configapi_upstream;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /data/ {
    rewrite ^/data/?(.*)$ /$1 break;
    proxy_pass $dataapi_upstream;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /report/ {
    rewrite ^/report/?(.*)$ /$1 break;
    proxy_pass $reportapi_upstream;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location = /identity/signin-entra {
    proxy_pass $identityapi_signin_entra;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location = /identity/signin-utahid {
    proxy_pass $identityapi_signin_utahid;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /identity/ {
    rewrite ^/identity/?(.*)$ /$1 break;
    proxy_pass $identityapi_upstream;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
